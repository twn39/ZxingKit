name: ZxingKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Xcode ${{ matrix.xcode }}, Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.0'
            swift: '6.0'
          - xcode: '16.3'
            swift: '6.1'
          - xcode: '16.4'
            swift: '6.2'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Run SwiftLint
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint
          else
            echo "SwiftLint not installed on runner, skipping lint check."
          fi

      - name: Build Package (Swift ${{ matrix.swift }})
        run: |
          swift build

      - name: Run Unit Tests & Generate Coverage
        run: |
          chmod +x ./scripts/coverage.sh
          ./scripts/coverage.sh --html

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xcode-${{ matrix.xcode }}
          path: .build/codecov/html/
          if-no-files-found: ignore
